# tools/openocd/freewili2.cfg — OpenOCD config for the FreeWili2 (RP2350B) over
# the Raspberry Pi Debug Probe (CMSIS-DAP / SWD). Used by `fw flash` and `fw rtt`.
#
# The interface/target includes below use `[find ...]`, which resolves against
# OpenOCD's script search path. The `fw` CLI passes `-s <pico-sdk openocd
# scripts dir>` automatically; if you invoke openocd by hand, add that -s too.
source [find interface/cmsis-dap.cfg]
# The on-board "FreeWili Debug Probe (CMSIS-DAP)" is 0x2e8a:0x000c and exposes
# four CMSIS-DAP v2 interfaces. `cmsis-dap usb interface 0` makes this OpenOCD
# build reject the device outright ("unable to find a matching CMSIS-DAP
# device") -- its filter runs before the interface strings are read, so nothing
# ever matches. Naming the VID/PID and letting OpenOCD pick lands on interface
# 0 anyway, which is what the selector was asking for.
cmsis-dap vid_pid 0x2e8a 0x000c
adapter speed 5000
source [find target/rp2350.cfg]
